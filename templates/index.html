<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qammer Abbas - Secure Code Review Tool</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* General Styling */
        body {
            background-color: #ADE8F4;
            font-family: 'Times', serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        
        /* Navbar Styling */
        .navbar {
            background-color: #023E8A;
        }
        .navbar-brand, .nav-link {
            color: #f1faee !important;
            font-weight: bold;
        }
        .nav-link:hover {
            color: #CAF0F8!important;
        }
        .navbar-nav .active .nav-link {
            background-color: #ff9f43 !important;
            color: #1c1f2b !important;
            border-radius: 5px;
        }
        
        /* Container Styling */
        .container {
            margin-top: 50px;
            max-width: 800px;
        }
        h1 {
            font-weight: bold;
            color: #003049;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }
        .card {
            background-color: white;
            border: none;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="/">Security Testing Tool</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/history">History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ci_pipeline">CI Pipeline</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/">Code Analysis</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container">
        <h1>Welcome to Secure Coding</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form id="analysisForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Upload a File:</label>
                <input type="file" name="file" class="form-control-file mb-3">
            </div>
            <div class="form-group">
                <label for="code_input">Please Paste Your Code Here:</label>
                <textarea name="code_input" class="form-control large-textarea" rows="10" placeholder="Enter your code here..."></textarea>
            </div>
        
            <!-- ML Analysis Button -->
            <button type="button" class="btn btn-primary btn-lg mr-2" onclick="submitForm('/upload_ml')">ML Analysis</button>
        
            <!-- Bandit Analysis Button -->
            <button type="button" class="btn btn-secondary btn-lg" onclick="submitForm('/upload_bandit')">Bandit Analysis</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function submitForm(actionUrl) {
            const form = document.getElementById('analysisForm');
            form.action = actionUrl;
            form.submit();
        }
    </script>
</body>
</html>
